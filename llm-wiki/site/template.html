<title>睡眠科學 LLM Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sidebar index + one wiki page at a time, same night-paper palette as the slide deck so the two read as one project. */
:root{
  --bg:#EDF0F5; --panel:#F8F9FC; --ink:#1A2136; --muted:#586079; --line:#D2D8E4;
  --night:#33449A; --night-soft:#DDE2F4; --lamp:#B9650F; --lamp-soft:#F6E6D0; --warn:#A33A2E;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --panel:#161D31; --ink:#E5E8F1; --muted:#9AA2B9; --line:#2A3350;
  --night:#9AA9F2; --night-soft:#222C4D; --lamp:#F1A64C; --lamp-soft:#3A2A16; --warn:#F08A7C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --panel:#161D31; --ink:#E5E8F1; --muted:#9AA2B9; --line:#2A3350;
  --night:#9AA9F2; --night-soft:#222C4D; --lamp:#F1A64C; --lamp-soft:#3A2A16; --warn:#F08A7C; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
header{padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:900;font-size:24px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-left:10px}
.hlinks{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.hlinks a{color:var(--night)}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:16px;font-size:14px}
.nl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.ng{display:flex;flex-direction:column}
nav a{color:var(--ink);text-decoration:none;padding:3px 10px;border-radius:6px;line-height:1.45}
nav a:hover{background:var(--night-soft)}
nav a.on{background:var(--night);color:var(--panel)}
nav a:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:10px 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .ng{flex:1 1 140px}
}
article{min-width:0;max-width:760px}
.path{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:6px}
article h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.4vw,34px);line-height:1.3;text-wrap:balance;margin:0 0 16px}
article h2{font-size:20px;margin:28px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
article h3{font-size:17px;margin:18px 0 6px}
article p,article li{max-width:68ch}
article blockquote{margin:0 0 14px;padding:8px 14px;border-left:3px solid var(--night);background:var(--night-soft);border-radius:0 6px 6px 0;font-size:14px}
article blockquote p{margin:0}
a{color:var(--night)}
a.cite{font-family:var(--f-mono);font-size:12px;text-decoration:none;background:var(--night-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
a.wl{text-decoration:underline;text-decoration-color:var(--lamp);text-underline-offset:3px}
.broken{color:var(--warn);text-decoration:line-through}
.tablewrap{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:13px}
table.meta th{width:110px;white-space:nowrap;font-family:var(--f-mono);font-weight:400}
table.meta td{word-break:break-word}
code{font-family:var(--f-mono);font-size:.88em;background:var(--night-soft);padding:1px 5px;border-radius:4px}
pre{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:13px;line-height:1.55}
pre code{background:none;padding:0}
strong{color:var(--lamp)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
</style>

<header>
 <div class="hwrap">
  <div class="brand">睡眠科學 LLM Wiki<small>{{COUNT}} PAGES · KARPATHY PATTERN</small></div>
  <div class="hlinks"><a href="#index">目錄</a><a href="#log">執行與檢查紀錄</a><a href="#schema">規範 SCHEMA</a><a href="{{SLIDES_URL}}" target="_blank" rel="noopener">教學簡報 ↗</a></div>
 </div>
</header>
<div class="layout">
 <nav id="nav" aria-label="Wiki 頁面">
{{NAV}}
 </nav>
 <main id="main">
{{ARTICLES}}
  <div class="pager"><a id="pv" href="#">← 上一頁</a><a id="nx" href="#">下一頁 →</a></div>
 </main>
</div>
<script>
(function(){
  const arts=[...document.querySelectorAll('article')];
  const ids=arts.map(a=>a.id);
  const links=[...document.querySelectorAll('nav a')];
  const pv=document.getElementById('pv'), nx=document.getElementById('nx');
  function show(){
    const h=location.hash.slice(1);
    const id=ids.includes(h)?h:ids[0];
    arts.forEach(a=>{a.hidden=a.id!==id});
    links.forEach(l=>l.classList.toggle('on',l.dataset.id===id));
    const i=ids.indexOf(id);
    pv.hidden=i===0; nx.hidden=i===ids.length-1;
    if(i>0){pv.href='#'+ids[i-1];pv.textContent='← '+(document.querySelector('nav a[data-id="'+ids[i-1]+'"]')||{}).textContent}
    if(i<ids.length-1){nx.href='#'+ids[i+1];nx.textContent=(document.querySelector('nav a[data-id="'+ids[i+1]+'"]')||{}).textContent+' →'}
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',show);
  show();
})();
</script>
