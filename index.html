<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>睡眠科學 LLM Wiki 作業</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root{--bg:#EDF0F5;--panel:#F8F9FC;--ink:#1A2136;--muted:#586079;--line:#D2D8E4;--night:#33449A;--lamp:#B9650F}
@media (prefers-color-scheme:dark){:root{--bg:#0E1322;--panel:#161D31;--ink:#E5E8F1;--muted:#9AA2B9;--line:#2A3350;--night:#9AA9F2;--lamp:#F1A64C;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-left,0px)) 56px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,5vw,40px);margin:0 0 8px}
p{color:var(--muted);margin:0 0 28px}
.cards{display:grid;gap:14px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--lamp);outline:none}
a.card b{display:block;font-size:19px;color:var(--night)}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>睡眠科學 LLM Wiki 作業</h1>
<p>主題：生理時鐘、睡眠週期、咖啡因。先建立 LLM Wiki，再用 Wiki 生成教學 HTML 簡報。</p>
<div class="cards">
<a class="card" href="slides/"><b>教學簡報：為什麼晚上會想睡？</b><small>17 張，方向鍵或滑動翻頁；每張標出對應的 Wiki 頁面與來源</small></a>
<a class="card" href="wiki-site/"><b>LLM Wiki（可瀏覽版）</b><small>概念頁、迷思頁、來源摘要、原始資料、SCHEMA、執行與檢查紀錄</small></a>
<a class="card" href="https://github.com/1571isayu/LLM-Wiki-Sleep/tree/main/llm-wiki"><b>Wiki 原始檔（Markdown）</b><small>raw/、wiki/、SCHEMA.md，以及 lint.py、check_slides.py 兩支檢查程式</small></a>
</div>
</main>
</body>
</html>
